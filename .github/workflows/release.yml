name: Release

on:
  push:
    # A release is a semantic version and nothing else: vMAJOR.MINOR.PATCH.
    # No other tag starts a run, and the workflow creates none.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.12'

      - name: Check the tag against the package
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$TAG_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::$TAG_NAME is not a semantic version tag (vMAJOR.MINOR.PATCH)."
            exit 1
          fi
          version="${TAG_NAME#v}"
          packaged="$(python -c 'import runpy; print(runpy.run_path("src/heckler/_version.py")["__version__"])')"
          if [ "$version" != "$packaged" ]; then
            echo "::error::Tag $TAG_NAME does not match version $packaged in src/heckler/_version.py."
            exit 1
          fi
          if ! grep -q "^## \[${version//./\\.}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" dist/* --generate-notes
