name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      # One version failing should not hide the results for the others.
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        include:
          # ubuntu-latest no longer has a Python 3.9 build; 24.04 still does.
          - python-version: '3.9'
            os: ubuntu-24.04

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Format
        run: ruff format --check src/ tests/

      - name: Test
        run: pytest --cov=heckler --cov-report=term-missing

      - name: Self-scan
        run: heckler --ci --severity low .

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: mypy src/
