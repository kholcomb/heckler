name: CI

on:
  push:
    branches: [main]
  pull_request:

# No job writes to the repository, so the token can only read it.
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One version failing should not hide the results for the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        # Windows and macOS on one version each: what differs there is
        # paths, links and encodings, not the Python release.
        include:
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Format
        run: ruff format --check src/ tests/

      - name: Test
        run: pytest --cov=heckler --cov-report=term-missing

      - name: Self-scan
        run: heckler --ci --severity low .

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: mypy src/
      - run: pyright

  hooks:
    name: Commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"

      # .pre-commit-config.yaml, the hooks for working on heckler. The
      # commit-msg hook does not run: there is no message here to check.
      - name: Hooks of this repository
        run: pre-commit run --all-files --show-diff-on-failure

      # .pre-commit-hooks.yaml, the hooks heckler ships. pre-commit installs
      # them from this commit, as it does for a repository that uses them.
      # The lockfile hook is installed and then skipped: no lockfile is
      # tracked here.
      - name: Shipped hooks pass the tree
        run: pre-commit try-repo . --all-files

      # The finding is the wanted result, so GITHUB_ACTIONS is unset for the
      # hook: with it, heckler also writes each finding as an error on the run.
      - name: Shipped hook fails on a planted character
        run: |
          mkdir planted
          python - <<'EOF'
          from pathlib import Path
          Path("planted/expected-finding.py").write_text("# " + chr(0x202E) + "\n", encoding="utf-8")
          EOF
          if env -u GITHUB_ACTIONS pre-commit try-repo . heckler --files planted/expected-finding.py; then
            echo "::error::The heckler hook passed a file that holds U+202E."
            exit 1
          fi

      # Both entries end with --, so a staged name that starts with "-" is a
      # file to scan. One batch (PRE_COMMIT_NO_CONCURRENCY), so that the
      # name and what it sits beside reach the same heckler run.
      - name: Shipped hooks read a name that starts with a dash as a file
        run: |
          repo="$RUNNER_TEMP/dash-names"
          git init -q "$repo"
          git -C "$repo" -c user.name=ci -c user.email=ci@example.invalid commit -q --allow-empty -m init
          python - "$repo" <<'EOF'
          import json, sys
          from pathlib import Path
          repo = Path(sys.argv[1])
          lock = {"lockfileVersion": 3, "packages": {"": {}, "node_modules/heckler-ci-not-installed": {"version": "9.9.9"}}}
          (repo / "expected-finding.py").write_text("# " + chr(0x202E) + "\n", encoding="utf-8")
          (repo / "--version").write_text("note\n", encoding="utf-8")
          (repo / "-hf").mkdir()
          for name in ("package-lock.json", "-hf/package-lock.json"):
              (repo / name).write_text(json.dumps(lock, indent=2) + "\n", encoding="utf-8")
          EOF
          git -C "$repo" add -A
          cd "$repo"
          for hook in heckler heckler-lockfile; do
            if env -u GITHUB_ACTIONS PRE_COMMIT_NO_CONCURRENCY=1 pre-commit try-repo "$GITHUB_WORKSPACE" "$hook"; then
              echo "::error::The $hook hook passed beside a staged name that starts with a dash."
              exit 1
            fi
          done

  action:
    name: Action
    runs-on: ubuntu-latest
    # The upload below writes to code scanning. Nothing else in this
    # workflow has more than read access.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      # action.yml from this commit, with no inputs: what a workflow gets
      # when it only names the action. It is ./ and not $/, here and below:
      # GitHub documents $/ for a directory in the repository and says
      # nothing of an action.yml at the root, and actionlint 1.7.12 takes
      # $/ for an error.
      - name: Action passes the tree
        uses: ./  # zizmor: ignore[self-repository]

      # The ruleset on main asks for code-scanning results from heckler, so
      # the scan of the tree is uploaded, before anything is planted in it.
      # A pull request from a fork gets a read-only token and cannot upload.
      - name: Action uploads the scan of the tree
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./  # zizmor: ignore[self-repository]
        with:
          upload-sarif: true

      - name: Plant a character
        run: |
          mkdir planted
          python3 - <<'EOF'
          from pathlib import Path
          Path("planted/expected-finding.py").write_text("# " + chr(0x202E) + "\n", encoding="utf-8")
          EOF

      # JSON, because the text report also writes each finding as an error
      # on the run, and this finding is the wanted result.
      - name: Action fails on a planted character
        id: planted
        continue-on-error: true
        uses: ./  # zizmor: ignore[self-repository]
        with:
          path: planted
          format: json

      - name: Check that the action failed
        if: steps.planted.outcome != 'failure'
        run: |
          echo "::error::The action passed a file that holds U+202E."
          exit 1

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.12'

      # As release.yml builds it: the sdist, then the wheel from the sdist.
      - name: Build
        run: |
          pip install build
          python -m build

      # With no index pip can fetch nothing, so a runtime dependency fails
      # the install.
      - name: Install the wheel alone
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install --no-index dist/*.whl

      - name: Run the installed package
        run: |
          "$RUNNER_TEMP/clean/bin/heckler" --version
          "$RUNNER_TEMP/clean/bin/heckler" --ci --severity low src

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"

      # Syntax, expressions and the shell in each run step.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      # Token permissions, pinning and injection, in the workflows and in
      # action.yml. Offline: it is given no token and asks GitHub nothing.
      - name: zizmor
        run: zizmor --offline .
