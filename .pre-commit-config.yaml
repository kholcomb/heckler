# Commit hooks for working on heckler itself.
# Run `pre-commit install` once after cloning; it sets up both hook types.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        # Python only: the hook would otherwise also rewrite the code samples
        # in the Markdown docs.
        types_or: [python, pyi]

  # The type checks run when a file under src/ is staged, and read all of
  # src/ whichever file it was: a change in one module can break another.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        # In place of the mirror's own arguments, which loosen the check.
        # This is the command CI runs, under [tool.mypy] in pyproject.toml.
        args: [src/]
        pass_filenames: false
        files: ^src/

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.414
    hooks:
      - id: pyright
        # No arguments, as in CI: what to check and how strictly is
        # [tool.pyright] in pyproject.toml.
        pass_filenames: false
        files: ^src/

  # The workflows, action.yml and the two pre-commit files, when one of them
  # is staged: the files that `zizmor --offline .` reads in CI.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
        # In place of the hook's own arguments, so --no-progress is repeated.
        # Offline: zizmor would otherwise take a token from GH_TOKEN or
        # GITHUB_TOKEN in the shell and ask GitHub about each action.
        args: [--offline, --no-progress]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
