[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heckler"
dynamic = ["version"]
description = "Detect dangerous invisible Unicode characters in source code and dependencies"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "heckler contributors" }]
keywords = ["security", "unicode", "glassworm", "trojan-source", "supply-chain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
heckler = "heckler.cli:cli_main"

[project.optional-dependencies]
# regex and packaging are reference implementations that the tests check
# heckler's own Unicode table and version parsing against. Nothing in
# src/ imports them. Every version here is exact, and Renovate raises it
# (.github/renovate.json), so a release that breaks a check does so on its
# own pull request. regex is at a release with the Unicode data that the
# table in characters.py was generated from.
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "pyright==1.1.414",
    "pre-commit==4.7.0",
    "regex==2026.11.9",
    "packaging==26.3",
]

[project.urls]
Repository = "https://github.com/kholcomb/heckler"
Issues = "https://github.com/kholcomb/heckler/issues"

[tool.hatch.version]
path = "src/heckler/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/heckler"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

# Read by Pyright in CI and in the commit hook, and by an editor that uses
# Pyright or Pylance.
[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.heckler]
# Default config — can also use .heckler.yml
