- id: heckler
  name: Heckler Unicode Security Scan
  description: Detect dangerous invisible Unicode characters in source code
  # Every file, not only the ones pre-commit takes for text: its test calls
  # a file binary for a single NUL in the first 1,024 bytes, which would let
  # one byte keep a file from the scan. --skip-binary has heckler decide.
  entry: heckler --ci --skip-binary
  language: python
  types: [file]
  require_serial: false

- id: heckler-lockfile
  name: Heckler Dependency Check (changed packages)
  description: Scan changed dependencies for invisible Unicode attacks
  entry: heckler --ci --scan-deps --diff-only
  language: python
  # Only the lockfiles heckler can parse; handed any other, it fails the hook
  # rather than pass a file it did not check. tests/test_lockfile.py keeps
  # this pattern and the parsers in step.
  files: (^|/)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml|requirements[^/]*\.txt|poetry\.lock|Pipfile\.lock)$
  pass_filenames: true
  stages: [pre-commit]
  minimum_pre_commit_version: '3.2.0'  # the first release with the pre-commit stage name
